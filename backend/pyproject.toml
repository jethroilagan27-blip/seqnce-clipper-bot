[project]
name = "svb-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "google-genai>=3.0.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_whisper: uses the real faster-whisper model (needs the model cached; slow)",
    "live_ai: calls the real Gemini API using GEMINI_API_KEY from .env (uses free-tier quota)",
]
addopts = "-m 'not real_whisper and not live_ai'"
